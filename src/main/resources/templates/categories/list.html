<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>カテゴリ管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div th:replace="~{fragments/sidebar :: appLayout}"></div>
  <div class="app-content container-fluid px-3 px-lg-4 py-3">
    <div class="mb-3">
      <div class="tag mb-2">設定</div>
      <h1 class="page-title mb-1">カテゴリ管理</h1>
      <div class="hint">よく使う支出・収入を整理しておくと入力が早くなります。</div>
    </div>

    <div class="alert alert-warning" th:if="${deleteError}" th:text="${deleteError}"></div>

    <div class="card-elevated p-3 mb-4">
      <div class="section-title mb-2">新しいカテゴリを追加</div>
      <form method="post" action="/categories" class="row g-3">
      <div class="col-md-3">
        <label class="form-label">カテゴリ名</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="col-md-2">
        <label class="form-label">色</label>
        <input type="color" name="color" class="form-control form-control-color" value="#4D96FF">
      </div>
      <div class="col-md-2">
        <label class="form-label">並び順</label>
        <input type="number" name="sortOrder" class="form-control" value="0">
      </div>
      <div class="col-md-2">
        <label class="form-label">タイプ</label>
        <select name="type" class="form-select">
          <option value="expense">支出</option>
          <option value="income">収入</option>
          <option value="both">両方</option>
        </select>
      </div>
      <div class="col-md-3 d-grid">
        <button type="submit" class="btn btn-accent">カテゴリ追加</button>
      </div>
    </form>
    </div>

    <div class="table-responsive card-elevated p-2">
      <table class="table table-striped table-bordered">
        <thead class="table-dark">
          <tr>
            <th>名前</th>
            <th>色</th>
            <th>並び順</th>
            <th>タイプ</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="c : ${categories}">
            <td th:text="${c.name}"></td>
            <td>
              <span class="badge" th:style="'background:' + ${c.color}" th:text="${c.color}"></span>
            </td>
            <td th:text="${c.sortOrder}"></td>
            <td th:text="${c.type}"></td>
            <td class="d-flex gap-1">
              <form method="post" action="/categories/move">
                <input type="hidden" name="id" th:value="${c.id}">
                <input type="hidden" name="direction" value="up">
                <button type="submit" class="btn btn-sm btn-outline-secondary">↑</button>
              </form>
              <form method="post" action="/categories/move">
                <input type="hidden" name="id" th:value="${c.id}">
                <input type="hidden" name="direction" value="down">
                <button type="submit" class="btn btn-sm btn-outline-secondary">↓</button>
              </form>
              <a th:href="@{'/categories/edit/' + ${c.id}}" class="btn btn-sm btn-outline-primary">編集</a>
              <form method="post" action="/categories/delete">
                <input type="hidden" name="id" th:value="${c.id}">
                <button type="submit" class="btn btn-sm btn-danger">削除</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="mt-3">
      <a href="/accounts" class="btn btn-secondary">家計簿へ戻る</a>
    </div>
  </div>
</body>
</html>
