<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>カテゴリ編集</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div th:replace="~{fragments/sidebar :: appLayout}"></div>
  <div class="app-content container-fluid px-3 px-lg-4 py-3">
    <div class="mb-3">
      <div class="tag mb-2">編集</div>
      <h1 class="page-title mb-1">カテゴリ編集</h1>
      <div class="hint">並び順は一覧の表示順に反映されます。</div>
    </div>

    <div class="card-elevated p-3">
      <form method="post" action="/categories/update" th:object="${category}" class="row g-3">
      <input type="hidden" th:field="*{id}">
      <div class="col-md-4">
        <label class="form-label">カテゴリ名</label>
        <input type="text" th:field="*{name}" class="form-control" required>
      </div>
      <div class="col-md-2">
        <label class="form-label">色</label>
        <input type="color" th:field="*{color}" class="form-control form-control-color">
      </div>
      <div class="col-md-2">
        <label class="form-label">並び順</label>
        <input type="number" th:field="*{sortOrder}" class="form-control">
      </div>
      <div class="col-md-2">
        <label class="form-label">タイプ</label>
        <select th:field="*{type}" class="form-select">
          <option value="expense">支出</option>
          <option value="income">収入</option>
          <option value="both">両方</option>
        </select>
      </div>
      <div class="col-md-2 d-grid">
        <button type="submit" class="btn btn-accent">更新</button>
      </div>
    </form>
    </div>

    <div class="mt-3">
      <a href="/categories" class="btn btn-secondary">戻る</a>
    </div>
  </div>
</body>
</html>
