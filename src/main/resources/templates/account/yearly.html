<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>年間収支</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div th:replace="~{fragments/sidebar :: appLayout}"></div>
  <div class="app-content container-fluid px-3 px-lg-4 py-3">
    <div class="app-header">
      <p class="app-header-title">年間収支</p>
      <p class="app-header-sub" th:text="${year} + '年の収支推移'"></p>
    </div>

    <div class="card-elevated p-3 mb-4">
      <form method="get" action="/accounts/yearly" class="row g-3 align-items-end">
        <div class="col-md-2">
          <label class="form-label">対象年</label>
          <select name="year" class="form-select">
            <option th:each="y : ${#numbers.sequence(2000,2026)}" th:value="${y}" th:text="${y}" th:selected="${y == year}"></option>
          </select>
        </div>
        <div class="col-md-2 d-grid">
          <button type="submit" class="btn btn-accent">表示</button>
        </div>
      </form>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card-elevated p-3 h-100">
          <div class="hint">年間収入</div>
          <div class="fs-4 fw-bold" th:text="${annualIncome} + '円'"></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card-elevated p-3 h-100">
          <div class="hint">年間支出</div>
          <div class="fs-4 fw-bold" th:text="${annualExpense} + '円'"></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card-elevated p-3 h-100">
          <div class="hint">年間差額</div>
          <div class="fs-4 fw-bold" th:text="${annualBalance} + '円'"></div>
        </div>
      </div>
    </div>

    <div class="chart-card mb-4">
      <h2 class="mb-3">年間推移グラフ</h2>
      <div class="chart-wrap chart-wrap-lg">
        <canvas id="yearlyChart"></canvas>
      </div>
    </div>

    <div class="table-responsive card-elevated p-2">
      <table class="table table-striped table-bordered mb-0">
        <thead class="table-dark">
          <tr>
            <th>月</th>
            <th class="text-end">収入</th>
            <th class="text-end">支出</th>
            <th class="text-end">差額</th>
            <th class="text-end">累計差額</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="row : ${monthlyRows}">
            <td th:text="${row.month} + '月'"></td>
            <td class="text-end" th:text="${row.income} + '円'"></td>
            <td class="text-end" th:text="${row.expense} + '円'"></td>
            <td class="text-end" th:text="${row.balance} + '円'"></td>
            <td class="text-end" th:text="${row.cumulative} + '円'"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script th:inline="javascript">
    /*<![CDATA[*/
    window.yearlyIncome = /*[[${monthlyIncome}]]*/ {};
    window.yearlyExpense = /*[[${monthlyExpense}]]*/ {};
    window.yearlyBalance = /*[[${monthlyBalance}]]*/ {};
    /*]]>*/
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/js/yearlyChart.js"></script>
</body>
</html>
