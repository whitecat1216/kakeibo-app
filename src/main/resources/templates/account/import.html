<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>CSVインポート</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div th:replace="~{fragments/sidebar :: appLayout}"></div>
  <div class="app-content container-fluid px-3 px-lg-4 py-3">
    <div class="app-header">
      <p class="app-header-title">CSV Import</p>
      <p class="app-header-sub">銀行明細や他アプリのCSVを取り込んで、手入力を減らせます。</p>
    </div>
    <div class="mb-3">
      <div class="tag mb-2">取込</div>
      <h1 class="page-title mb-1">CSVインポート</h1>
      <div class="hint">推奨ヘッダー: 日付, タイプ, カテゴリ, 支払方法, 項目, 金額, メモ</div>
    </div>

    <div class="card-elevated p-3 mb-4">
      <form method="post" action="/accounts/import" enctype="multipart/form-data" class="row g-3">
        <div class="col-12">
          <label class="form-label">CSVファイル</label>
          <input type="file" name="file" class="form-control" accept=".csv" required>
        </div>
        <div class="col-12 form-check ms-2">
          <input type="hidden" name="skipDuplicates" value="false">
          <input class="form-check-input" type="checkbox" id="skipDuplicates" name="skipDuplicates" value="true" checked>
          <label class="form-check-label" for="skipDuplicates">重複データをスキップする</label>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-accent">インポート実行</button>
          <a href="/accounts" class="btn btn-secondary ms-2">一覧に戻る</a>
        </div>
      </form>
    </div>

    <div class="alert alert-danger" th:if="${importError}" th:text="${importError}"></div>

    <div class="card-elevated p-3" th:if="${result != null}">
      <div class="section-title mb-2">実行結果</div>
      <ul class="list-group list-group-flush">
        <li class="list-group-item">読込行数: <span th:text="${result.total}"></span></li>
        <li class="list-group-item">取込件数: <span th:text="${result.imported}"></span></li>
        <li class="list-group-item">スキップ件数: <span th:text="${result.skipped}"></span></li>
      </ul>

      <div class="mt-3" th:if="${!#lists.isEmpty(result.errors)}">
        <div class="section-title mb-2">エラー詳細</div>
        <div class="alert alert-warning mb-0">
          <div th:each="err : ${result.errors}" th:text="${err}"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
