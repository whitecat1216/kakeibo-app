<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>明細リスト</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div th:replace="~{fragments/sidebar :: appLayout}"></div>
  <div class="app-content container-fluid px-3 px-lg-4 py-3">
    <div class="app-header">
      <p class="app-header-title">明細リスト</p>
      <p class="app-header-sub">検索して明細を確認・編集・削除します。</p>
    </div>

    <div class="card-elevated p-3 mb-4">
      <div class="section-title mb-2">検索・期間フィルタ</div>
      <form method="get" action="/accounts/list" class="row g-3 align-items-end">
        <div class="col-md-2">
          <label class="form-label">年</label>
          <select name="year" class="form-select">
            <option th:each="y : ${#numbers.sequence(2000,2026)}" th:value="${y}" th:text="${y}" th:selected="${y == year}"></option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">月</label>
          <select name="month" class="form-select">
            <option th:each="m : ${#numbers.sequence(1, 12)}" th:value="${m}" th:text="${m}" th:selected="${m == month}"></option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">収支タイプ</label>
          <select name="type" class="form-select">
            <option value="" th:selected="${type == null or type == ''}">指定なし</option>
            <option value="income" th:selected="${type == 'income'}">収入</option>
            <option value="expense" th:selected="${type == 'expense'}">支出</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">期間（開始）</label>
          <input type="date" name="startDate" class="form-control" th:value="${startDate}">
        </div>
        <div class="col-md-3">
          <label class="form-label">期間（終了）</label>
          <input type="date" name="endDate" class="form-control" th:value="${endDate}">
        </div>
        <div class="col-md-3">
          <label class="form-label">カテゴリ</label>
          <select name="categoryId" class="form-select">
            <option value="" th:selected="${categoryId == null}">指定なし</option>
            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${categoryId != null and c.id == categoryId}"></option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">支払方法</label>
          <select name="sourceId" class="form-select">
            <option value="" th:selected="${sourceId == null}">指定なし</option>
            <option th:each="s : ${sources}" th:value="${s.id}" th:text="${s.name}" th:selected="${sourceId != null and s.id == sourceId}"></option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">金額（最小）</label>
          <input type="number" name="minAmount" class="form-control" th:value="${minAmount}">
        </div>
        <div class="col-md-2">
          <label class="form-label">金額（最大）</label>
          <input type="number" name="maxAmount" class="form-control" th:value="${maxAmount}">
        </div>
        <div class="col-md-2">
          <label class="form-label">メモ検索</label>
          <input type="text" name="memo" class="form-control" th:value="${memo}">
        </div>
        <div class="col-md-2 d-grid">
          <button type="submit" class="btn btn-accent">検索</button>
        </div>
        <div class="col-md-2 d-grid">
          <a href="/accounts/list" class="btn btn-outline-secondary">リセット</a>
        </div>
      </form>
    </div>

    <div class="card-elevated p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <div class="section-title" th:text="${year} + '年' + ${month} + '月の集計'"></div>
          <div class="hint">収入: <span th:text="${income}"></span>円 / 支出: <span th:text="${expense}"></span>円 / 差額: <span th:text="${balance}"></span>円</div>
        </div>
        <div class="d-flex gap-2">
          <a href="/accounts/new" class="btn btn-accent-2">新規登録</a>
          <a href="/accounts/import" class="btn btn-outline-dark">CSVインポート</a>
          <a th:href="@{'/accounts/export?year=' + ${year} + '&month=' + ${month}}" class="btn btn-outline-secondary">CSV出力</a>
        </div>
      </div>
    </div>

    <form method="post" action="/accounts/bulk-delete">
      <div class="d-flex justify-content-end mb-2">
        <button type="submit" class="btn btn-danger btn-sm">選択した明細を一括削除</button>
      </div>
      <div class="table-responsive card-elevated p-2">
        <table class="table table-striped table-bordered mb-0">
          <thead class="table-dark">
            <tr>
              <th>選択</th>
              <th>日付</th>
              <th>収支</th>
              <th>カテゴリ</th>
              <th>支払方法</th>
              <th>項目</th>
              <th>金額</th>
              <th>メモ</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="account : ${accounts}">
              <td><input type="checkbox" name="ids" th:value="${account.id}"></td>
              <td th:text="${account.date}"></td>
              <td th:text="${account.type == 'income' ? '収入' : '支出'}"></td>
              <td th:text="${account.category != null ? account.category.name : ''}"></td>
              <td th:text="${account.source != null ? account.source.name : ''}"></td>
              <td th:text="${account.item}"></td>
              <td th:text="${account.amount}"></td>
              <td th:text="${account.memo}"></td>
              <td>
                <a th:href="@{'/accounts/edit/' + ${account.id}}" class="btn btn-sm btn-outline-primary">編集</a>
                <a th:href="@{'/accounts/duplicate/' + ${account.id}}" class="btn btn-sm btn-outline-secondary">複製</a>
                <a th:href="@{'/accounts/delete/' + ${account.id}}" class="btn btn-sm btn-danger">削除</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </form>

    <div class="empty-state mt-3" th:if="${#lists.isEmpty(accounts)}">
      該当する明細がありません。
    </div>
  </div>
</body>
</html>
