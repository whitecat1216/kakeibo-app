<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>レポート</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div th:replace="~{fragments/sidebar :: appLayout}"></div>
  <div class="app-content container-fluid px-3 px-lg-4 py-3">
    <div class="app-header">
      <p class="app-header-title">レポート</p>
      <p class="app-header-sub">支出の増減とカテゴリ傾向を確認します。</p>
    </div>

    <div class="card-elevated p-3 mb-4">
      <form method="get" action="/accounts/report" class="row g-3 align-items-end">
        <div class="col-md-2">
          <label class="form-label">年</label>
          <select name="year" class="form-select">
            <option th:each="y : ${#numbers.sequence(2000,2026)}" th:value="${y}" th:text="${y}" th:selected="${y == year}"></option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">月</label>
          <select name="month" class="form-select">
            <option th:each="m : ${#numbers.sequence(1, 12)}" th:value="${m}" th:text="${m}" th:selected="${m == month}"></option>
          </select>
        </div>
        <div class="col-md-2 d-grid">
          <button type="submit" class="btn btn-accent">表示</button>
        </div>
      </form>
    </div>

    <div class="card-elevated p-3 mb-4">
      <div class="section-title mb-2">レポート分析</div>
      <div class="report-grid mb-3">
        <div class="report-box">
          <div class="report-label">前月比（支出）</div>
          <div class="report-value" th:text="${prevMonthDiff >= 0 ? '+' : ''} + ${prevMonthDiff} + '円'"></div>
          <div class="hint" th:text="'前月: ' + ${prevMonthExpense} + '円 / 変化率: ' + ${#numbers.formatDecimal(prevMonthRate * 100, 1, 1)} + '%'"></div>
        </div>
        <div class="report-box">
          <div class="report-label">前年同月比（支出）</div>
          <div class="report-value" th:text="${prevYearDiff >= 0 ? '+' : ''} + ${prevYearDiff} + '円'"></div>
          <div class="hint" th:text="'前年同月: ' + ${prevYearExpense} + '円 / 変化率: ' + ${#numbers.formatDecimal(prevYearRate * 100, 1, 1)} + '%'"></div>
        </div>
      </div>
      <div class="row g-3">
        <div class="col-md-6">
          <div class="report-subtitle">上位支出カテゴリ</div>
          <table class="table table-sm mb-0" th:if="${!#lists.isEmpty(topExpenseCategories)}">
            <thead><tr><th>カテゴリ</th><th class="text-end">金額</th></tr></thead>
            <tbody>
              <tr th:each="entry : ${topExpenseCategories}">
                <td th:text="${entry.key}"></td>
                <td class="text-end" th:text="${entry.value} + '円'"></td>
              </tr>
            </tbody>
          </table>
          <div class="empty-state py-3" th:if="${#lists.isEmpty(topExpenseCategories)}">データがありません。</div>
        </div>
        <div class="col-md-6">
          <div class="report-subtitle">異常増加カテゴリ</div>
          <table class="table table-sm mb-0" th:if="${!#lists.isEmpty(anomalyCategories)}">
            <thead><tr><th>カテゴリ</th><th class="text-end">増加額</th><th class="text-end">増加率</th></tr></thead>
            <tbody>
              <tr th:each="a : ${anomalyCategories}">
                <td th:text="${a.name}"></td>
                <td class="text-end" th:text="'+' + ${a.diff} + '円'"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(a.rate * 100, 1, 1)} + '%'"></td>
              </tr>
            </tbody>
          </table>
          <div class="empty-state py-3" th:if="${#lists.isEmpty(anomalyCategories)}">大きな増加は検出されませんでした。</div>
        </div>
      </div>
    </div>

    <div class="chart-card mb-3">
      <h2 class="mb-3">カテゴリ別支出グラフ</h2>
      <div class="chart-wrap"><canvas id="categoryChart"></canvas></div>
    </div>
    <div class="chart-card mb-3">
      <h2 class="mb-3">カテゴリ別収入グラフ</h2>
      <div class="chart-wrap"><canvas id="incomeChart"></canvas></div>
    </div>
    <div class="chart-card mb-3">
      <h2 class="mb-3">月別収支推移グラフ</h2>
      <div class="chart-wrap chart-wrap-lg"><canvas id="monthlyChart"></canvas></div>
    </div>
  </div>

  <script th:inline="javascript">
    /*<![CDATA[*/
    window.categoryData = /*[[${categoryTotals}]]*/ {};
    window.incomeCategoryData = /*[[${incomeCategoryTotals}]]*/ {};
    window.monthlyIncome = /*[[${monthlyIncome}]]*/ {};
    window.monthlyExpense = /*[[${monthlyExpense}]]*/ {};
    window.monthlyBalance = /*[[${monthlyBalance}]]*/ {};
    /*]]>*/
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/js/categoryChart.js"></script>
</body>
</html>
