<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>ログイン</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card-elevated p-4">
          <div class="card-body p-0">
            <div class="tag mb-2">開始</div>
            <h2 class="page-title mb-2">ログイン</h2>
            <div class="hint mb-3">メールアドレスまたはユーザー名でログインできます。</div>

            <form th:action="@{/login}" method="post">
              <div class="mb-3">
              <label for="identifier" class="form-label">ユーザー名またはメールアドレス</label>
              <input type="text" id="identifier" name="identifier" class="form-control" required>
            </div>

              <div class="mb-3">
              <label for="password" class="form-label">パスワード</label>
              <input type="password" id="password" name="password" class="form-control" required>
            </div>

              <button type="submit" class="btn btn-accent w-100">ログイン</button>
            </form>

            <div th:if="${error}" class="alert alert-danger mt-3">
              <p th:text="${error}"></p>
            </div>

            <div th:if="${param.registered}" class="alert alert-success mt-3">
              登録が完了しました。ログインしてください。
            </div>

            <div class="mt-3 text-center">
              <a href="/users/register">新規登録はこちら</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
