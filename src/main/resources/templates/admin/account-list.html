<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>家計簿一覧（管理者）</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

  <h2 class="mb-4">
    ユーザー: <span th:text="${targetUser.username}"></span> の家計簿
  </h2>

  <table class="table table-bordered">
    <thead class="table-light">
      <tr>
        <th>日付</th>
        <th>タイプ</th>
        <th>カテゴリ</th>
        <th>項目</th>
        <th>金額</th>
        <th>メモ</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="a : ${accounts}">
        <td th:text="${a.date}"></td>
        <td th:text="${a.type}"></td>
        <td th:text="${a.category}"></td>
        <td th:text="${a.item}"></td>
        <td th:text="${a.amount}" class="text-end"></td>
        <td th:text="${a.memo}"></td>
      </tr>
    </tbody>
  </table>

  <div class="mt-4">
    <p><strong>収入:</strong> <span th:text="${income}"></span> 円</p>
    <p><strong>支出:</strong> <span th:text="${expense}"></span> 円</p>
    <p><strong>残高:</strong> <span th:text="${balance}"></span> 円</p>
  </div>

</body>
</html>
