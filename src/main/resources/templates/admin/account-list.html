<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>家計簿一覧（管理者）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/sidebar :: appLayout}"></div>
<div class="app-content container-fluid px-3 px-lg-4 py-3">
  <div class="app-header">
    <p class="app-header-title">Admin Ledger View</p>
    <p class="app-header-sub">ユーザー単位で家計簿データを確認できます。</p>
  </div>

  <h2 class="mb-4 page-title">
    ユーザー: <span th:text="${targetUser.username}"></span> の家計簿
  </h2>

  <div class="table-responsive card-elevated p-2">
  <table class="table table-bordered mb-0">
    <thead class="table-light">
      <tr>
        <th>日付</th>
        <th>タイプ</th>
        <th>カテゴリ</th>
        <th>支払方法</th>
        <th>項目</th>
        <th>金額</th>
        <th>メモ</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="a : ${accounts}">
        <td th:text="${a.date}"></td>
        <td th:text="${a.type == 'income' ? '収入' : '支出'}"></td>
        <td th:text="${a.category != null ? a.category.name : ''}"></td>
        <td th:text="${a.source != null ? a.source.name : ''}"></td>
        <td th:text="${a.item}"></td>
        <td th:text="${a.amount}" class="text-end"></td>
        <td th:text="${a.memo}"></td>
      </tr>
    </tbody>
  </table>
  </div>

  <div class="mt-4 card-elevated p-3">
    <p><strong>収入:</strong> <span th:text="${income}"></span> 円</p>
    <p><strong>支出:</strong> <span th:text="${expense}"></span> 円</p>
    <p><strong>残高:</strong> <span th:text="${balance}"></span> 円</p>
  </div>
</div>
</body>
</html>
