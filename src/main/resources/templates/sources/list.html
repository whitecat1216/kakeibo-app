<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>支払方法管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div th:replace="~{fragments/sidebar :: appLayout}"></div>
  <div class="app-content container-fluid px-3 px-lg-4 py-3">
    <div class="mb-3">
      <div class="tag mb-2">設定</div>
      <h1 class="page-title mb-1">支払方法管理</h1>
      <div class="hint">口座・財布・カードなどを登録すると、残高推移が見やすくなります。</div>
    </div>

    <div class="alert alert-warning" th:if="${deleteError}" th:text="${deleteError}"></div>

    <div class="card-elevated p-3 mb-4">
      <div class="section-title mb-2">新しい支払方法を追加</div>
      <form method="post" action="/sources" class="row g-3">
        <div class="col-md-4">
          <label class="form-label">名称</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">種類</label>
          <select name="type" class="form-select">
            <option value="cash">現金</option>
            <option value="bank">銀行</option>
            <option value="card">カード</option>
            <option value="ewallet">電子マネー</option>
            <option value="other">その他</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">初期残高</label>
          <input type="number" name="initialBalance" class="form-control" value="0">
        </div>
        <div class="col-md-2 d-grid">
          <button type="submit" class="btn btn-accent">追加</button>
        </div>
      </form>
    </div>

    <div class="table-responsive card-elevated p-2">
      <table class="table table-striped table-bordered">
        <thead class="table-dark">
          <tr>
            <th>名称</th>
            <th>種類</th>
            <th>初期残高</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="s : ${sources}">
            <td th:text="${s.name}"></td>
            <td th:text="${s.type}"></td>
            <td th:text="${s.initialBalance} + '円'"></td>
            <td class="d-flex gap-1">
              <a th:href="@{'/sources/edit/' + ${s.id}}" class="btn btn-sm btn-outline-primary">編集</a>
              <form method="post" action="/sources/delete">
                <input type="hidden" name="id" th:value="${s.id}">
                <button type="submit" class="btn btn-sm btn-danger">削除</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="mt-3">
      <a href="/accounts" class="btn btn-secondary">家計簿へ戻る</a>
    </div>
  </div>
</body>
</html>
