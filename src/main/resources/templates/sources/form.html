<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>支払方法編集</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div th:replace="~{fragments/sidebar :: appLayout}"></div>
  <div class="app-content container-fluid px-3 px-lg-4 py-3">
    <div class="mb-3">
      <div class="tag mb-2">編集</div>
      <h1 class="page-title mb-1">支払方法編集</h1>
      <div class="hint">初期残高は過去分の残高調整に使います。</div>
    </div>

    <div class="card-elevated p-3">
      <form method="post" action="/sources/update" th:object="${source}" class="row g-3">
        <input type="hidden" th:field="*{id}">
        <div class="col-md-4">
          <label class="form-label">名称</label>
          <input type="text" th:field="*{name}" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">種類</label>
          <select th:field="*{type}" class="form-select">
            <option value="cash">現金</option>
            <option value="bank">銀行</option>
            <option value="card">カード</option>
            <option value="ewallet">電子マネー</option>
            <option value="other">その他</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">初期残高</label>
          <input type="number" th:field="*{initialBalance}" class="form-control">
        </div>
        <div class="col-12 d-grid">
          <button type="submit" class="btn btn-accent">更新</button>
        </div>
      </form>
    </div>

    <div class="mt-3">
      <a href="/sources" class="btn btn-secondary">戻る</a>
    </div>
  </div>
</body>
</html>
