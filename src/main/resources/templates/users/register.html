<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>新規登録</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card-elevated p-4">
          <div class="card-body p-0">
            <div class="tag mb-2">開始</div>
            <h2 class="page-title mb-2">新規ユーザー登録</h2>
            <div class="hint mb-3">ユーザー名・メールアドレス・パスワードを登録します。</div>

            <form th:action="@{/users/register}" method="post">
              <div class="mb-3">
                <label for="username" class="form-label">ユーザー名</label>
                <input type="text" id="username" name="username" class="form-control" required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">メールアドレス</label>
                <input type="email" id="email" name="email" class="form-control" required>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">パスワード</label>
                <input type="password" id="password" name="password" class="form-control" required>
              </div>

              <button type="submit" class="btn btn-accent-2 w-100">登録</button>
            </form>

            <div th:if="${error}" class="alert alert-danger mt-3" role="alert">
              <p th:text="${error}"></p>
            </div>

            <div class="mt-3 text-center">
              <a href="/login">ログイン画面へ戻る</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
