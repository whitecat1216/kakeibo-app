<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>定期収支</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <div class="mb-3">
      <div class="tag mb-2">自動化</div>
      <h1 class="page-title mb-1">定期収支</h1>
      <div class="hint">家賃や給与など、毎月同じ明細を自動で作成します。</div>
    </div>

    <div class="mb-3 text-end">
      <a href="/recurring/new" class="btn btn-accent-2">新規追加</a>
    </div>

    <div class="table-responsive card-elevated p-2">
      <table class="table table-striped table-bordered">
        <thead class="table-dark">
          <tr>
            <th>収支</th>
            <th>カテゴリ</th>
            <th>支払方法</th>
            <th>項目</th>
            <th>金額</th>
            <th>日</th>
            <th>開始</th>
            <th>終了</th>
            <th>状態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="r : ${recurringList}">
            <td th:text="${r.type == 'income' ? '収入' : '支出'}"></td>
            <td th:text="${r.category != null ? r.category.name : ''}"></td>
            <td th:text="${r.source != null ? r.source.name : ''}"></td>
            <td th:text="${r.item}"></td>
            <td th:text="${r.amount}"></td>
            <td th:text="${r.dayOfMonth} + '日'"></td>
            <td th:text="${r.startDate}"></td>
            <td th:text="${r.endDate}"></td>
            <td th:text="${r.active ? '有効' : '停止'}"></td>
            <td class="d-flex gap-1">
              <a th:href="@{'/recurring/edit/' + ${r.id}}" class="btn btn-sm btn-outline-primary">編集</a>
              <form method="post" action="/recurring/toggle">
                <input type="hidden" name="id" th:value="${r.id}">
                <button type="submit" class="btn btn-sm btn-outline-secondary" th:text="${r.active ? '停止' : '再開'}"></button>
              </form>
              <form method="post" action="/recurring/delete">
                <input type="hidden" name="id" th:value="${r.id}">
                <button type="submit" class="btn btn-sm btn-danger">削除</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="empty-state mt-3" th:if="${#lists.isEmpty(recurringList)}">
      定期収支がまだありません。新規追加から登録してください。
    </div>

    <div class="mt-3">
      <a href="/accounts" class="btn btn-secondary">家計簿へ戻る</a>
    </div>
  </div>
</body>
</html>
