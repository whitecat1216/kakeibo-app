<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>定期収支登録</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <div class="mb-3">
      <div class="tag mb-2">自動化</div>
      <h1 class="page-title mb-1">定期収支登録</h1>
      <div class="hint">毎月同じ日に作成される明細を登録します。</div>
    </div>

    <div class="card-elevated p-3">
      <form th:action="${recurring.id} != null ? @{/recurring/update} : @{/recurring/save}"
            th:object="${recurring}" method="post" class="row g-3">
      <input type="hidden" th:field="*{id}">
      <div class="col-md-3">
        <label class="form-label">収支タイプ</label>
        <select th:field="*{type}" class="form-select">
          <option value="income">収入</option>
          <option value="expense">支出</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">カテゴリ</label>
        <select name="categoryId" class="form-select" required>
          <option value="" disabled th:selected="${recurring.category == null}">選択してください</option>
          <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                  th:selected="${recurring.category != null and c.id == recurring.category.id}"></option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">支払方法</label>
        <select name="sourceId" class="form-select">
          <option value="" th:selected="${recurring.source == null}">指定なし</option>
          <option th:each="s : ${sources}" th:value="${s.id}" th:text="${s.name}"
                  th:selected="${recurring.source != null and s.id == recurring.source.id}"></option>
        </select>
      </div>
      <div class="col-md-5">
        <label class="form-label">項目</label>
        <input type="text" th:field="*{item}" class="form-control">
      </div>
      <div class="col-md-4">
        <label class="form-label">金額</label>
        <input type="number" th:field="*{amount}" class="form-control" required>
      </div>
      <div class="col-md-8">
        <label class="form-label">メモ</label>
        <input type="text" th:field="*{memo}" class="form-control">
      </div>
      <div class="col-md-3">
        <label class="form-label">毎月の何日</label>
        <input type="number" th:field="*{dayOfMonth}" min="1" max="31" class="form-control" required>
        <div class="hint mt-1">月末は自動で月末日に調整されます。</div>
      </div>
      <div class="col-md-4">
        <label class="form-label">開始日</label>
        <input type="date" th:field="*{startDate}" class="form-control" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">終了日</label>
        <input type="date" th:field="*{endDate}" class="form-control">
      </div>
      <div class="col-md-1">
        <label class="form-label">有効</label>
        <input type="checkbox" th:field="*{active}" class="form-check-input mt-2">
      </div>
      <div class="col-12 d-grid">
        <button type="submit" class="btn btn-accent">保存</button>
      </div>
    </form>
    </div>

    <div class="mt-3">
      <a href="/recurring" class="btn btn-secondary">戻る</a>
    </div>
  </div>
</body>
</html>
